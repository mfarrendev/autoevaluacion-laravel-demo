services:
  mysql:
    image: mysql:8.4
    container_name: autoevaluacion-mysql
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: autoevaluacion
      MYSQL_USER: app
      MYSQL_PASSWORD: secret
    ports:
      - "127.0.0.1:33060:3306"
    volumes:
      - mysql-datos:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-datos:
